name: voice-rag

x-database-url: &database-url postgresql+asyncpg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}

services:
  api:
    build: ./services/api
    image: voice-rag-api:local
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
      LLM_FALLBACK: ${LLM_FALLBACK:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
      GIGACHAT_CREDENTIALS:
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-2}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-true}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-512}
      PROMPT_VERSION: ${PROMPT_VERSION:-v2}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.0}
      RAG_CONTEXT_TOKENS: ${RAG_CONTEXT_TOKENS:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STT: ${STT:-stub}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      VAD: ${VAD:-energy}
      VAD_MIN_SILENCE_MS: ${VAD_MIN_SILENCE_MS:-600}
      TTS: ${TTS:-stub}
      TTS_SPEAKER: ${TTS_SPEAKER:-xenia}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-24000}
      VOICE_STREAMING: ${VOICE_STREAMING:-true}
      VOICE_FIRST_CHUNK_CHARS: ${VOICE_FIRST_CHUNK_CHARS:-80}
      STUB_LLM_TOKEN_DELAY: ${STUB_LLM_TOKEN_DELAY:-0}
      STUB_TTS_REALTIME_FACTOR: ${STUB_TTS_REALTIME_FACTOR:-0}
      EMBEDDER: ${EMBEDDER:-hashing}
      OPENAI_API_KEY:
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-128}
      EMBEDDING_CACHE_SIZE: ${EMBEDDING_CACHE_SIZE:-10000}
      VECTOR_STORE: ${VECTOR_STORE:-qdrant}
      SEARCH_MODE: ${SEARCH_MODE:-bm25}
      RRF_K: ${RRF_K:-60}
      RERANKER: ${RERANKER:-none}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      CHUNK_SIZE: ${CHUNK_SIZE:-300}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-45}
      DATABASE_URL: *database-url
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_TOKEN:
      TELEGRAM_SECRET:
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WHITELIST: ${TELEGRAM_WHITELIST:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    image: voice-rag-api:local
    pull_policy: never
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6334}:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && read -r status <&3 && [[ $$status == *' 200 '* ]]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
  redis-data:

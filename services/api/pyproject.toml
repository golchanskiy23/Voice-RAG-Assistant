[project]
name = "voice-rag-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20,<1.22",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres,qdrant]>=4.15.0",
    "types-docker>=7.2.0.20261006",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = ["integration: тесты против реальных Postgres и Qdrant в testcontainers"]

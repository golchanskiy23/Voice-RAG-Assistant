[project]
name = "voice-rag-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "gigachat>=0.2.3",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "pikepdf>=10.17.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20,<1.22",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "httpx2>=2.16.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "reportlab>=5.1.0",
    "ruff>=0.8",
    "testcontainers[postgres,qdrant]>=4.15.0",
    "types-docker>=7.2.0.20261006",
    "types-reportlab>=5.0.0.20261008",
    "websockets>=15",
]
local-models = [
    "faster-whisper>=1.1",
    "torch>=2.5",
    "transformers>=4.46",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration and not llm"]
markers = [
    "integration: тесты против реальных Postgres и Qdrant в testcontainers",
    "llm: регрессия промпта против реального LLM, нужен ключ провайдера в окружении",
]
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
    "ignore:Local mode performs exact:UserWarning",
]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory services/api ruff check --fix .
        language: system
        files: ^services/api/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory services/api ruff format .
        language: system
        files: ^services/api/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory services/api mypy app tests migrations
        language: system
        files: ^services/api/.*\.py$
        pass_filenames: false
